# Copia a config.yaml. Empieza SIEMPRE en paper.
mode: paper            # paper | live
quote_mint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v   # USDC (moneda base del bot)
quote_decimals: 6
state_dir: state

scanner:
  interval_seconds: 20          # revisión de posiciones abiertas
  entry_interval_seconds: 60    # búsqueda de entradas
  max_candidates: 200
  discovery_cache_seconds: 120
  include_gecko: true           # trending / más activos de GeckoTerminal
  include_boosted: true
  include_profiles: true

filters:                       # prefiltro en tiempo real (DexScreener)
  min_liquidity_usd: 40000
  max_liquidity_usd: 100000000
  min_age_minutes: 30
  max_age_minutes: 4320
  min_volume_h1_usd: 30000
  min_txns_h1: 200
  min_buy_ratio_m5: 0.0        # 0 = desactivado
  max_fdv_usd: 1000000000
  allowed_dexes: [raydium, pumpswap, meteora, orca]

strategy:                      # señal validada en backtest (bot/signals.py)
  name: momentum
  params: {}
  max_ohlcv_per_cycle: 8

brain:                         # cerebro autónomo: elige estrategia y salidas (nunca el riesgo)
  enabled: true
  auto_apply_live: true        # aplica sus decisiones en real sin pedir aprobación
  defensive_in_paper: false    # en paper sigue operando aunque no haya ventaja (para aprender)

context:                       # noticias y contexto de mercado
  enabled: true
  refresh_minutes: 10
  pause_sol_h1_drop: 5.0       # frena entradas si SOL cae ≥ 5 % en 1 h
  pause_sol_h24_drop: 15.0     # … o ≥ 15 % en 24 h
  pause_on_critical_news: true # … o hay un hackeo/caída en el ecosistema Solana (últimas 6 h)
safety:
  require_mint_revoked: true
  require_freeze_revoked: true
  max_top10_pct: 35
  use_rugcheck: true
  max_rugcheck_danger: 0
  simulate_sell: true

risk:
  starting_equity_usd: 1000    # presupuesto del bot (no tu patrimonio)
  risk_per_trade_pct: 1.0
  max_position_pct: 5.0
  max_pool_share_pct: 1.0
  max_open_positions: 4
  daily_loss_limit_pct: 5.0
  cooldown_minutes: 240
  slippage_bps: 300
  max_price_impact_pct: 3.0

exits:
  stop_loss_pct: 25
  take_profits: [[100, 50], [300, 25]]   # [+% ganancia, % de la posición inicial a vender]
  trailing_stop_pct: 30
  trailing_activation_pct: 50
  time_stop_minutes: 90
  time_stop_min_gain_pct: 10
  liquidity_drop_exit_pct: 40
