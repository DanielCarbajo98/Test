# Todo el sistema 24/7. Arranque:  docker compose up -d     ·  Logs:  docker compose logs -f bot
# Cambiar paper -> real: edita config.yaml (mode: live) y  docker compose restart bot
x-base: &base
  build: .
  restart: always            # se levanta solo si falla o si el servidor se reinicia
  init: true                 # gestión correcta de señales (parada limpia)
  env_file: .env
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  bot:                       # el que opera
    <<: *base
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./state:/app/state
      - ./bot:/app/bot:ro
      - ./research:/app/research:ro
    command: ["python", "-m", "bot.main", "--config", "config.yaml"]

  panel:                     # http://127.0.0.1:8050 (en el servidor: túnel SSH)
    <<: *base
    ports:
      - "127.0.0.1:8050:8050"
    volumes:
      - ./state:/app/state
      - ./bot:/app/bot:ro
    command: ["python", "-m", "bot.dashboard", "--state", "state", "--host", "0.0.0.0"]

  brain:                     # aprendizaje continuo: reentrena cada 30 min, reoptimización completa cada 6 h
    <<: *base
    volumes:
      - ./data:/app/data
      - ./data_launches:/app/data_launches
      - ./state:/app/state
      - ./bot:/app/bot:ro
      - ./research:/app/research:ro
    command: ["python", "-m", "bot.brain", "--data", "data,data_launches", "--state", "state", "--every-min", "30", "--full-every", "12"]

  collector:                 # velas "a futuro" del universo activo
    <<: *base
    volumes:
      - ./data:/app/data
      - ./bot:/app/bot:ro
      - ./research:/app/research:ro
    command: ["python", "-m", "research.collect", "--loop", "15", "--out", "data"]

  launches:                  # lanzamientos al azar (muestra sin sesgo) + sus velas
    <<: *base
    volumes:
      - ./data_launches:/app/data_launches
      - ./bot:/app/bot:ro
      - ./research:/app/research:ro
    command: ["sh", "-c", "while true; do python -m research.sample_launches --minutes 60 --every 180; python -m research.sample_launches --fetch; done"]

  stocks:                    # acciones: alertas de compra/venta por Telegram (cada 15 min)
    <<: *base
    volumes:
      - ./state:/app/state
      - ./bot:/app/bot:ro
    command: ["python", "-m", "bot.stocks", "--state", "state", "--loop", "15"]

  updater:                   # actualizaciones automáticas desde tu GitHub (cada 30 min, con tests previos)
    <<: *base
    volumes:
      - ./:/work
    command: ["python", "-m", "bot.updater", "--work", "/work", "--loop", "30"]
