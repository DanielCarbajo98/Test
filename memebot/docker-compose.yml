services:
  paper:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.paper.yaml:/app/config.yaml:ro
      - ./state-paper:/app/state
    command: ["python", "-m", "bot.main", "--config", "config.yaml"]
  panel:                        # http://127.0.0.1:8050 (en el VPS: túnel SSH)
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8050:8050"
    volumes:
      - ./state-paper:/app/state      # cambia a ./state-live cuando operes en real
    command: ["python", "-m", "bot.dashboard", "--state", "state", "--host", "0.0.0.0"]
  live:
    build: .
    restart: unless-stopped
    env_file: .env
    profiles: ["live"]          # solo arranca con: docker compose --profile live up -d
    volumes:
      - ./config.live.yaml:/app/config.yaml:ro
      - ./state-live:/app/state
  collector:                    # dataset de backtest "a futuro" (sin sesgo de selección)
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "research.collect", "--loop", "15", "--out", "data"]
  launches:                     # muestra de lanzamientos al azar + sus velas
    build: .
    restart: unless-stopped
    volumes:
      - ./data_launches:/app/data_launches
    command: ["sh", "-c", "while true; do python -m research.sample_launches --minutes 60 --every 180; python -m research.sample_launches --fetch; done"]
